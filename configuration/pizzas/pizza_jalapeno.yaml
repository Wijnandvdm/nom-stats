recipe_name: 'Pizza Jalapeño Business'
description: 'Mind your own business, this pizza is spicy'
ingredients:
  - name: 'skyr'
    quantity: 100
  - name: 'zelfrijzend bakmeel'
    quantity: 100
  - name: 'bertolli pizzasaus piccante'
    quantity: 90
  - name: 'ah geraspte kaas 20+'
    quantity: 75
  - name: 'jalapeno'
    quantity: 2
steps:
  - "Meng skyr met zelfrijzend bakmeel tot een niet plakkend deeg"
  - "Laat het bolletje deeg 10 minuten rusten"
  - "Rol het bolletje deeg uit tot pizzabodem, wanneer het plakt, strooi er dan een snufje bloem overheen"
  - "Plaats de pizzabodem 5-10 min in de oven"
  - "Haal de pizzabodem uit de oven"
  - "Spreid tomatensaus op de pizzabodem"
  - "Bestrooi de tomatensaus met kaas"
  - "Snijd de jalapeños in ringetjes en verdeel ze over de pizza"
  - "Plaats de pizza 10-15 min in de oven"
rating: 5
spice_level: 5
preparation_time: 40
dietary_labels:
  - vegetarian
